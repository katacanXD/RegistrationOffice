spring.datasource.url=jdbc:h2:mem:registrationoffice-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

security.jwt.secret=change-me-super-secret-key-32-bytes-min
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-seconds=1209600
security.jwt.refresh-cookie-name=refresh_token
security.jwt.cookie-secure=false
security.jwt.cookie-same-site=Lax
security.jwt.cookie-path=/api/v1/auth
security.jwt.cleanup-cron=0 0 3 * * *

