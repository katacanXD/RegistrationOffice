spring.application.name=RegistrationOffice
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true

security.jwt.secret=${SECURITY_JWT_SECRET:${JWT_SECRET}}
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-seconds=1209600
security.jwt.refresh-cookie-name=refresh_token
security.jwt.cookie-secure=true
security.jwt.cookie-same-site=Lax
security.jwt.cookie-path=/api/v1/auth
security.jwt.cleanup-cron=0 0 3 * * *

# Comma-separated exact origins, for example: https://app.example.com,https://admin.example.com
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
# Comma-separated origin patterns, for example: https://*.example.com
app.security.cors.allowed-origin-patterns=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:}

logging.level.ru.katacan.registrationoffice=DEBUG
logging.level.org.springframework.security=DEBUG

