stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "178.154.216.17"
  DEPLOY_USER: "nabotov"
  DEPLOY_PATH: "/home/nabotov/RegistrationOffice"

build:
  stage: build
  image: gradle:9.3.1-jdk21
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon compileJava
  only:
    - master
    - merge_requests

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"
    - >
      rsync -avz --delete
      --exclude '.git'
      --exclude '.env'
      --exclude 'build'
      --exclude '.gradle'
      -e "ssh -o StrictHostKeyChecking=no"
      ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
    - |
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} <<EOF
      set -e
      cd ${DEPLOY_PATH}
      if [ ! -f .env ]; then
        cp .env.example .env
      fi
      if ! grep -Eq '^SECURITY_JWT_SECRET=.+' .env; then
        if grep -q '^SECURITY_JWT_SECRET=' .env; then
          sed -i 's/^SECURITY_JWT_SECRET=.*/SECURITY_JWT_SECRET=change_me_super_long_random_secret_min_32_chars/' .env
        else
          echo 'SECURITY_JWT_SECRET=change_me_super_long_random_secret_min_32_chars' >> .env
        fi
      fi
      sudo docker compose down
      sudo docker compose up -d --build
      EOF
  only:
    - master
  when: manual
