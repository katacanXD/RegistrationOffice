name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - backend
      - 'feature/**'      # все feature-ветки
  pull_request:
    branches:
      - master
      - backend

jobs:
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master' || github.event_name == 'push'   # build на всех ветках + PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project (compile + test)
        run: ./gradlew --no-daemon build --continue

      - name: Archive build artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH + rsync + Docker
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: "178.154.216.17"
          DEPLOY_USER: "nabotov"
          DEPLOY_PATH: "/home/nabotov/RegistrationOffice"
        run: |
          # Устанавливаем необходимые пакеты (rsync + openssh-client)
          sudo apt-get update -qq
          sudo apt-get install -y rsync openssh-client

          # Настройка SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Деплой через rsync
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'build' \
            --exclude '.gradle' \
            --exclude '.gitverse' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

          # Перезапуск Docker на сервере
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
            cd ${DEPLOY_PATH} &&
            if [ ! -f .env ]; then cp .env.example .env || true; fi &&
            sudo docker compose down &&
            sudo docker compose up -d --build
          "
