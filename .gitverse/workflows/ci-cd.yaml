name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - backend
      - 'feature/**'
  pull_request:
    branches:
      - master
      - backend

jobs:
  build:
    name: Build (Backend + Frontend)
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Build project (compile + test)
        working-directory: backend
        run: ./gradlew --no-daemon build --continue

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH + rsync + Docker
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: "178.154.216.17"
          DEPLOY_USER: "nabotov"
          DEPLOY_PATH: "/home/nabotov/RegistrationOffice"

          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SECURITY_JWT_SECRET: ${{ secrets.SECURITY_JWT_SECRET }}
          APP_SECURITY_CORS_ALLOWED_ORIGINS: ""
          APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: "*"
          #APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:3000
          #APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: ""

        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rsync openssh-client

          # Настройка SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Создаём директорию проекта на сервере
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_PATH}"

          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'backend/build' \
            --exclude 'backend/.gradle' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'frontend/.vite' \
            --exclude '.gitverse' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

          # Обновляем .env на сервере и перезапускаем Docker Compose
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} <<EOF
          set -e
          cd ${DEPLOY_PATH}
          cat > .env <<ENVFILE
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          SECURITY_JWT_SECRET=${SECURITY_JWT_SECRET}
          APP_SECURITY_CORS_ALLOWED_ORIGINS=${APP_SECURITY_CORS_ALLOWED_ORIGINS}
          APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS}
          ENVFILE
          sudo docker compose down
          sudo docker compose up -d --build
          EOF
